# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application
on:
  push:
    tags:
      - 'v*' # 只要推送以 v 开头的 Tag（如 v1.0.0, v2.1）就会触发
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write # 修复：赋予写入权限以支持发布 Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 同时在三个原生系统上运行构建任务
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 指定你的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        python -c "import os; os.system('pip install -r requirements.txt') if os.path.exists('requirements.txt') else None"

    - name: Build executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile pdf2img.py

    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --noconsole pdf2img.py

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
      env:
        # 修复：补齐右括号 }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
